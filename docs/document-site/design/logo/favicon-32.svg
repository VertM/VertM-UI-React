    <rect x="20" y="25" width="5.5" height="16" rx="2.75"/>
    <rect x="29.5" y="19" width="5.5" height="26" rx="2.75"/>
  </g>
  <rect x="39" y="28" width="5.5" height="10" rx="2.75" fill="#3F7CE0"/>
  <circle cx="50" cy="18" r="3.4" fill="#E0AA4E"/>
</svg>
